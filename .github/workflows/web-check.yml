name: Web app checks

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/web-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required web assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q './styles.css' index.html
          grep -q './app.js' index.html
